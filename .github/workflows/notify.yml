name: Telegram bildirim
on:
  schedule:
    - cron: "0 6 * * *"   # 09:00 Türkiye (06:00 UTC)
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Durumu hesapla ve gönder
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta
          TR = timezone(timedelta(hours=3))
          now = datetime.now(timezone.utc)
          items = json.load(open("data.json")).get("items", [])
          if not items:
              print("Açık ürün yok, mesaj atılmadı"); raise SystemExit
          lines = ["🧊 Sabah kontrolü"]
          for it in items:
              opened = datetime.fromisoformat(it["openedAt"].replace("Z", "+00:00"))
              end = opened + timedelta(days=it["days"])
              left = end - now
              h = int(left.total_seconds() // 3600)
              if h < 0:
                  st = "🔴 SÜRE DOLDU — dök"
              elif h < 24:
                  st = f"🟡 SON GÜN — {h} saat kaldı"
              else:
                  st = f"🟢 {h // 24} gün {h % 24} sa kaldı"
              lines.append(f"{it.get('e','📦')} {it['n']} — açıldı {opened.astimezone(TR):%d.%m %H:%M} → son {end.astimezone(TR):%d.%m %H:%M}\n   {st}")
          msg = "\n".join(lines)
          url = f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage"
          body = urllib.parse.urlencode({"chat_id": os.environ["TG_CHAT"], "text": msg}).encode()
          print(urllib.request.urlopen(urllib.request.Request(url, data=body)).read().decode()[:200])
          EOF
